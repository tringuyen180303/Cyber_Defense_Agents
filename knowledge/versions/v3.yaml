  learned_from:
  - rt-fast-exfil-known-network+drop-discovery
  - rt-fast-exfil-known-network+slow
- id: learned_critical_iamwrite
  kind: rule
  weight: 0.4
  severity: 7
  all_of:
  - critical_resource
  - iam_write
