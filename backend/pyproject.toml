[project]
name = "sentinel"
version = "0.1.0"
description = "Autonomous cloud incident response: CloudTrail alert to verified remediation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "openai>=1.50",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=0.7"]
aws = ["boto3>=1.34"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]
