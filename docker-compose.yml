services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: sentinel-clickhouse
    ports:
      - "8123:8123"   # HTTP (used by clickhouse-connect)
      - "19000:9000"  # native protocol (clickhouse-client --port 19000)
    environment:
      CLICKHOUSE_DB: sentinel
      CLICKHOUSE_USER: sentinel
      CLICKHOUSE_PASSWORD: sentinel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 3s
      retries: 20

volumes:
  clickhouse-data:
