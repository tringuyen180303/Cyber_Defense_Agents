services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: sentinel-clickhouse
    ports:
      - "8123:8123"   # HTTP (used by clickhouse-connect and Grafana)
      - "19000:9000"  # native protocol (clickhouse-client --port 19000)
    environment:
      CLICKHOUSE_DB: sentinel
      CLICKHOUSE_USER: sentinel
      CLICKHOUSE_PASSWORD: sentinel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 3s
      retries: 20

  # Sentinel → OTLP → collector → ClickHouse (otel.otel_traces / otel.otel_logs)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.147.0
    container_name: sentinel-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "14317:4317"  # OTLP gRPC
      - "14318:4318"  # OTLP HTTP (used by Sentinel)
    depends_on:
      clickhouse: { condition: service_healthy }

  grafana:
    image: grafana/grafana:11.3.0
    container_name: sentinel-grafana
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agents.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      clickhouse: { condition: service_healthy }

volumes:
  clickhouse-data:
  grafana-data:
