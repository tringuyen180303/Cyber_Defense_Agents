rules:
  - id: gha-echo-aws-secret
    message: AWS credential environment variable is printed to the CI log
    severity: ERROR
    languages: [generic]
    paths:
      include: ["*.yml", "*.yaml"]
    pattern-regex: (echo|printf).*\$\{?AWS_(SECRET_ACCESS_KEY|SESSION_TOKEN)
    metadata:
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      category: credential-exposure

  - id: gha-shell-xtrace-with-aws-creds
    message: "`set -x` traces commands (including expanded credentials) into the CI log"
    severity: WARNING
    languages: [generic]
    paths:
      include: ["*.yml", "*.yaml"]
    pattern-regex: set -x
    metadata:
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      category: credential-exposure

  - id: env-dump-to-artifact
    message: Full environment (including AWS session credentials) is written to a file that is uploaded as a build artifact
    severity: ERROR
    languages: [generic]
    paths:
      include: ["*.sh"]
    pattern-regex: \benv\b\s*(\|[^>\n]*)?>\s*\S+
    metadata:
      cwe: "CWE-538: Insertion of Sensitive Information into Externally-Accessible File"
      category: credential-exposure

  - id: gha-long-lived-aws-keys
    message: Workflow uses long-lived IAM user access keys instead of GitHub OIDC role federation
    severity: WARNING
    languages: [generic]
    paths:
      include: ["*.yml", "*.yaml"]
    pattern-regex: AWS_SECRET_ACCESS_KEY:\s*\$\{\{\s*secrets\.
    metadata:
      category: credential-hygiene
